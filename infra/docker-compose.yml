services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ai_traveler_frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend/src:/app/src
    depends_on:
      - api

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ai_traveler_api
    env_file:
      - ../backend/.env.example
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ../backend/app:/app/app

  db:
    image: postgres:16
    container_name: ai_traveler_db
    environment:
      POSTGRES_DB: ai_traveler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ai_traveler_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
