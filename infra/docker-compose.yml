services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ai_traveler_frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend/src:/app/src
    depends_on:
      - api

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ai_traveler_api
    env_file:
      - ../backend/.env.example
      - path: ../backend/.env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../backend/app:/app/app
      - ../backend/alembic:/app/alembic

  db:
    image: postgres:16
    container_name: ai_traveler_db
    environment:
      POSTGRES_DB: ai_traveler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_traveler"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: ai_traveler_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
